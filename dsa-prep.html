<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A focused home page for the dsa-prep problem sheet." />
    <meta name="color-scheme" content="dark light" />
    <title>dsa-prep — Home</title>
    <link rel="stylesheet" href="src/styles/fonts.css" />
    <link rel="stylesheet" href="src/styles/themes.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <style>
      .home-hero {
        display: block;
        min-height: 100svh;
        padding: 40px 0;
      }

      .home-inner {
        width: min(100% - 48px, 1030px);
        margin-inline: auto;
      }

      .home-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--fg);
        font:
          700 14px 'JetBrains Mono',
          monospace;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .home-brand-mark {
        color: var(--accent);
      }

      .home-content {
        width: min(100% - 48px, 1030px);
        margin: 0 auto;
        padding: 105px 0 80px;
      }

      .home-content .eyebrow {
        margin-bottom: 22px;
      }

      .home-content h1 {
        max-width: 790px;
        font:
          800 clamp(2.5rem, 7vw, 5.6rem) / 1.02 'JetBrains Mono',
          monospace;
        letter-spacing: -0.07em;
        margin: 0 0 22px;
      }

      .home-content h1 span {
        color: var(--accent);
      }

      .home-content .hero-lede {
        max-width: 670px;
        margin-bottom: 30px;
      }

      .home-note {
        margin-top: 38px;
        color: var(--muted);
        font:
          10px 'JetBrains Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .home-note i {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 12px var(--good);
      }

      @media (max-width: 600px) {
        .home-inner,
        .home-content {
          width: min(100% - 36px, 1030px);
        }

        .home-content {
          padding-top: 82px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero home-hero">
        <div class="orb one" aria-hidden="true"></div>
        <div class="orb two" aria-hidden="true"></div>
        <div class="home-inner">
          <a class="home-brand" href="home.html" aria-label="dsa-prep home">
            <span class="home-brand-mark">/</span> dsa-prep
          </a>
        </div>

        <div class="home-content">
          <div class="eyebrow">
            <span class="tag">your practice workspace</span>
            <span>·</span>
            <span>369 problems / 16 topics</span>
          </div>
          <h1>Make progress.<br /><span>One problem at a time.</span></h1>
          <p class="hero-lede">
            A calm, searchable home for your DSA practice—solutions, patterns, and progress all in
            one place.
          </p>
          <div class="button-row">
            <a class="btn btn-primary" href="src/index.html">
              Open the sheet <span aria-hidden="true">→</span>
            </a>
          </div>
          <p class="home-note"><i aria-hidden="true"></i>Progress stays in your browser</p>
        </div>
      </section>
    </main>

    <script>
      (() => {
        'use strict';

        const availableThemes = new Set(['dark', 'light', 'cyber']);
        const defaultTheme = 'dark';

        try {
          const savedTheme = localStorage.getItem('dsa-prep-theme');
          const theme = availableThemes.has(savedTheme) ? savedTheme : defaultTheme;

          document.documentElement.dataset.theme = theme;
        } catch (error) {
          // Storage can be unavailable in private or restricted browsing contexts.
          document.documentElement.dataset.theme = defaultTheme;
        }
      })();
    </script>

</html>
